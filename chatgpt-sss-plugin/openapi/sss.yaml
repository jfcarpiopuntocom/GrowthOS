openapi: 3.1.0
info:
  title: Startup Survival Score API
  version: 0.2.0
  description: Deterministic SSS calculation and Pro analysis endpoints.
servers:
  - url: https://YOUR-HOST.example.com
paths:
  /health:
    get:
      operationId: health
      responses:
        "200": { description: OK }
  /api/calculate:
    post:
      operationId: calculateSSS
      summary: Calculate the free Startup Survival Score
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SSSInput" }
      responses:
        "200":
          description: SSS result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSSResult" }
  /api/analyze:
    post:
      operationId: analyzeSSS
      summary: Pro prioritized SSS analysis
      parameters:
        - in: header
          name: x-sss-license
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SSSInput" }
      responses:
        "200": { description: Prioritized analysis }
        "402": { description: Pro license required }
  /api/simulate:
    post:
      operationId: simulateCashflow
      summary: Pro 24-month cashflow simulation
      parameters:
        - in: header
          name: x-sss-license
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [openingCash, monthlyRevenue, monthlyCosts, scenario]
              properties:
                openingCash: { type: number }
                monthlyRevenue: { type: number, minimum: 0 }
                monthlyCosts: { type: number, minimum: 0 }
                revenueGrowthPct: { type: number, default: 0 }
                costGrowthPct: { type: number, default: 0 }
                scenario: { type: string, enum: [base, stress, crash] }
      responses:
        "200": { description: 24 month simulation }
        "402": { description: Pro license required }
  /api/report:
    post:
      operationId: generateReport
      summary: Pro print-ready HTML report
      parameters:
        - in: header
          name: x-sss-license
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SSSInput" }
      responses:
        "200":
          description: HTML report
          content:
            text/html:
              schema: { type: string }
        "402": { description: Pro license required }
components:
  schemas:
    SSSInput:
      type: object
      additionalProperties: false
      required: [runwayMonths,cacPaybackMonths,burnMultiple,grossMarginPct,workingCapitalRatio,customerConcentrationPct,debtToCashflowVelocity,capitalEfficiencyIndex]
      properties:
        runwayMonths: { type: number, minimum: 0 }
        cacPaybackMonths: { type: number, minimum: 0 }
        burnMultiple: { type: number, minimum: 0 }
        grossMarginPct: { type: number, minimum: 0, maximum: 100 }
        workingCapitalRatio: { type: number, minimum: 0 }
        customerConcentrationPct: { type: number, minimum: 0, maximum: 100 }
        debtToCashflowVelocity: { type: number, minimum: 0 }
        capitalEfficiencyIndex: { type: number, minimum: 0 }
        locale: { type: string, enum: [en, es, pt], default: en }
    SSSResult:
      type: object
      required: [score,risk,metrics,actionPlan]
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        risk: { type: string, enum: [green,yellow,red] }
        metrics: { type: array, items: { type: object } }
        actionPlan: { type: array, maxItems: 3, items: { type: object } }
